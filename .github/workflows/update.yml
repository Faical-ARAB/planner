name: Update meal planner

# Rebuilds index.html so the dates always match the current month.
on:
  schedule:
    - cron: "0 5 1 * *"      # 05:00 UTC on the 1st of every month
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # allows the built-in token to commit the new file

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the planner
        run: python generate.py --prefs preferences.json --out index.html

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes this run."
          else
            git commit -m "Auto-update meal planner for $(date +'%B %Y')"
            git push
          fi
